server:
  port: 9090

spring:
  devtools:
    restart:
      enabled: false
    add-properties: false

  application:
    name: monitoring

  docker:
    compose:
      enabled: false

  task:
    scheduling:
      pool:
        # Le guard Huawei centralise déjà les appels.
        size: 3

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/monitoring}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

providers:
  huawei:
    enabled: true
    base-url: https://intl.fusionsolar.huawei.com
    username: api.api.api.api.api.api
    password: ""
    accounts:
      - key: itscom-api-01
        group: itscom
        username: api.api.api.api.api.api
        password: ""

      - key: itscom-api-02
        group: itscom
        username: api.api
        password: ""

      - key: itscom-api-03
        group: itscom
        username: api.api.api
        password: ""

      - key: itscom-api-04
        group: itscom
        username: api.api.api.api
        password: ""

      - key: itscom-api-05
        group: itscom
        username: api.api.api.api.api
        password: ""

      # Compte FusionSolar / entreprise 2.
      - key: global-engineering-api-01
        group: global-engineering
        username: client1
        password: ""

      - key: global-engineering-api-02
        group: global-engineering
        username: client2
        password: ""

      - key: global-engineering-api-03
        group: global-engineering
        username: client3
        password: ""

      - key: global-engineering-api-04
        group: global-engineering
        username: client4
        password: ""

      - key: global-engineering-api-05
        group: global-engineering
        username: client5
        password: ""

  solis:
    enabled: true
    base-url: ${SOLIS_BASE_URL:https://www.soliscloud.com:13333}
    key-id: ${SOLIS_KEY_ID:}
    key-secret: ${SOLIS_KEY_SECRET:}

  growatt:
    enabled: true
    base-url: https://openapi.growatt.com
    accounts:
      - key: growatt-1
        group: ITS
        token: ""

      - key: growatt-2
        group: COMPTE2
        token: ""

app:
  auth:
    # Sites dont le nom/code commence par les préfixes projet autorisés.
    username: vora.orange
    password: ""

    # Même périmètre, avec accès au Planning terrain.
    orange-local-username: vora.orange.local
    orange-local-password: ""

    # Sites appartenant au groupe FusionSolar global-engineering.
    ooredoo-username: vora.ooredoo
    ooredoo-password: ""

    # Sites de tous les fournisseurs sans préfixe projet.
    independent-username: client
    independent-password: ""

  huawei-api:
    # Les comptes d'un même groupe partagent cette cadence.
    # Deux groupes différents ne se bloquent pas entre eux.
    quota-scope: ${HUAWEI_QUOTA_SCOPE:group}
    group-min-request-interval-ms: 300000
    history-group-min-request-interval-ms: 60000
    login-min-request-interval-ms: 300000
    initial-rate-limit-cooldown-ms: 1800000
    max-rate-limit-cooldown-ms: 10800000

  huawei-sync:
    summary-cron: "0 */10 * * * *"
    inventory-initial-delay-ms: 30000
    inventory-fixed-delay-ms: 10800000
    state-initial-delay-ms: 15000
    state-retry-check-ms: 15000
    year-energy-enabled: false

    device-sync-initial-delay-ms: 1800000
    device-sync-fixed-delay-ms: 43200000

    batch-size: 100
    delay-between-batches-ms: 90000
    min-summary-refresh-interval-ms: 600000

    # Les historiques Huawei sont gérés par history-batch-backfill.
    min-history-provider-delay-ms: 90000

    year-energy-initial-delay-ms: 900000
    year-energy-fixed-delay-ms: 3600000
    year-energy-batch-size: 1
    year-energy-delay-between-sites-ms: 60000
    year-energy-max-age-ms: 21600000

  solis-sync:
    summary-cron: "0 */5 * * * *"
    min-summary-refresh-interval-ms: 300000
    min-history-provider-delay-ms: 0

    device-sync-initial-delay-ms: 90000
    device-sync-fixed-delay-ms: 43200000

    # Désactivé pour ne pas doubler les appels avec le backfill Mongo.
    history-warmup-enabled: false

    history-batch-size: 1
    history-delay-between-sites-ms: 15000

    history-current-initial-delay-ms: 240000
    history-current-fixed-delay-ms: 900000

    history-yearly-initial-delay-ms: 1200000
    history-yearly-fixed-delay-ms: 21600000

  growatt-sync:
    summary-initial-delay-ms: 15000
    summary-fixed-delay-ms: 600000
    min-summary-refresh-interval-ms: 600000
    min-history-provider-delay-ms: 0
    device-sync-initial-delay-ms: 120000
    device-sync-fixed-delay-ms: 43200000

  history-batch-backfill:
    enabled: true
    initial-delay-ms: 60000
    fixed-delay-ms: 15000
    max-huawei-calls-per-run: 2
    huawei-batch-size: 100
    max-lookback-months: 120
    huawei-report-daily-call-limit: 22
    historic-day-backfill-enabled: true
    historic-day-lookback-days: 30
    empty-history-retry-ms: 86400000

    # Reprises vides : 24 h, 48 h, 96 h... avec plafond de 7 jours.
    # Après 3 réponses valides mais vides, contrôle périodique du bucket.
    empty-history-max-retry-ms: 604800000
    empty-confirmed-after-attempts: 3

    current-day-refresh-ms: 900000

    # Le mois courant est cumulatif : 4 contrôles par jour.
    current-month-refresh-ms: 21600000
    current-year-refresh-ms: 21600000
    yearly-refresh-ms: 86400000

    incomplete-month-refresh-ms: 21600000
    invalid-value-month-refresh-ms: 21600000
    month-finalization-grace-hours: 6

  solis-batch-backfill:
    # Désactivé pour éviter les courbes Solis identiques entre sites.
    # Le remplissage MONTH/YEAR passe par des appels station par station.
    enabled: false
    initial-delay-ms: 180000
    fixed-delay-ms: 30000
    max-calls-per-run: 2
    batch-size: 100
    max-lookback-months: 120
    empty-history-retry-ms: 86400000
    current-month-refresh-ms: 21600000
    current-year-refresh-ms: 21600000

  history-backfill:
    enabled: true

    # Workers indépendants Solis/Growatt.
    # La cadence est protégée dans les clients API.
    initial-delay-ms: 120000
    fixed-delay-ms: 1000
    max-provider-calls-per-run: 6
    delay-between-provider-calls-ms: 0
    empty-history-retry-ms: 86400000

    # 6 h : évite de rappeler le même mois incomplet en boucle.
    incomplete-month-refresh-ms: 21600000
    invalid-value-month-refresh-ms: 21600000
    max-lookback-months: 120
    historic-day-backfill-enabled: true
    historic-day-lookback-days: 30
    solis-year-backfill-enabled: true
    current-day-refresh-ms: 900000
    current-month-refresh-ms: 21600000
    current-year-refresh-ms: 21600000

  ai-report:
    # Clé fournie par variable d'environnement ou fichier privé externe.
    provider: "gemini"
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: "gemini-2.5-flash"
      base-url: "https://generativelanguage.googleapis.com/v1beta"
      timeout-seconds: 180
      max-output-tokens: 65000